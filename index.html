<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TNBES | Energy Audit Progress Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --red:#E7262C;
    --red-dark:#B81E23;
    --navy:#101B4C;
    --navy-2:#1B2A78;
    --navy-soft:#3B4A9E;
    --paper:#F4F5FA;
    --paper-2:#EAEBF4;
    --card:#FFFFFF;
    --line:#DDE0EE;
    --ink:#12163B;
    --ink-soft:#5A5F82;
    --amber:#F0A93A;
    --green:#1E9E5A;
    --shadow: 0 1px 2px rgba(16,27,76,.06), 0 8px 24px -12px rgba(16,27,76,.18);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 100% -10%, #fff 0%, var(--paper) 55%),
      var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{ font-family:'Barlow Condensed',sans-serif; font-weight:800; letter-spacing:.01em; text-transform:uppercase; }
  .mono{ font-family:'JetBrains Mono',monospace; }
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}
  ::selection{ background:var(--red); color:#fff; }
  :focus-visible{ outline:2.5px solid var(--red); outline-offset:2px; }

  /* ---------- Bolt icon ---------- */
  .bolt{ display:inline-block; }

  /* ---------- Login ---------- */
  .login-wrap{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    background:
      radial-gradient(900px 500px at 15% 10%, rgba(231,38,44,.10), transparent 60%),
      radial-gradient(900px 600px at 85% 90%, rgba(16,27,76,.10), transparent 60%),
      var(--navy);
    position:relative; overflow:hidden;
  }
  .login-wrap::before{
    content:""; position:absolute; inset:0;
    background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 42px 42px;
    mask-image: radial-gradient(700px 500px at 50% 30%, black, transparent);
  }
  .login-card{
    position:relative; width:100%; max-width:400px; background:var(--card); border-radius:18px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,.5); padding:36px 32px 30px; text-align:center;
  }
  .logo-mark{ width:74px; height:74px; margin:0 auto 6px; }
  .brand-title{ font-size:34px; color:var(--navy); line-height:1; margin:8px 0 2px; }
  .brand-sub{ font-size:12px; letter-spacing:.14em; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; }
  .field-label{ display:block; text-align:left; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); margin:18px 0 6px; }
  .field-input{
    width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid var(--line); background:var(--paper);
    font-size:15px; color:var(--ink); transition:border-color .15s, background .15s;
  }
  .field-input:focus{ border-color:var(--red); background:#fff; }
  .btn-primary{
    margin-top:22px; width:100%; padding:13px; border:none; border-radius:10px;
    background:linear-gradient(180deg, var(--red) 0%, var(--red-dark) 100%); color:#fff; font-weight:700;
    font-size:14px; letter-spacing:.03em; box-shadow:0 10px 20px -8px rgba(231,38,44,.55);
    transition:transform .12s ease;
  }
  .btn-primary:active{ transform:scale(.98); }
  .login-hint{ margin-top:16px; font-size:11.5px; color:var(--ink-soft); line-height:1.5; }
  .login-error{ margin-top:14px; font-size:12.5px; color:var(--red-dark); background:#FDEBEC; border:1px solid #F7C6C8; padding:8px 10px; border-radius:8px; display:none; }

  /* ---------- App shell ---------- */
  .topbar{
    position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:14px;
    padding:12px 22px; background:var(--navy); color:#fff; box-shadow:var(--shadow);
  }
  .topbar .logo-mark{ width:36px; height:36px; margin:0; flex:none; }
  .topbar-title{ font-size:20px; line-height:1; }
  .topbar-sub{ font-size:10px; font-family:'JetBrains Mono',monospace; color:#B9C0F0; letter-spacing:.12em; }
  .topbar-spacer{ flex:1; }
  .user-chip{ display:flex; align-items:center; gap:10px; font-size:13px; }
  .user-chip .who{ text-align:right; line-height:1.2; }
  .user-chip .who b{ display:block; font-size:13px; }
  .user-chip .who span{ font-size:10.5px; color:#B9C0F0; font-family:'JetBrains Mono',monospace; }
  .logout-btn{
    border:1.5px solid rgba(255,255,255,.25); background:rgba(255,255,255,.06); color:#fff; padding:7px 12px;
    border-radius:8px; font-size:12px; font-weight:600; transition:background .15s;
  }
  .logout-btn:hover{ background:rgba(255,255,255,.16); }

  .breadcrumb{
    display:flex; align-items:center; flex-wrap:wrap; gap:0; padding:14px 22px; background:var(--card);
    border-bottom:1px solid var(--line);
  }
  .crumb{
    font-size:12.5px; font-weight:600; color:var(--ink-soft); padding:6px 10px; border-radius:7px; background:transparent;
    border:none; transition:background .15s,color .15s;
  }
  .crumb.active{ color:var(--navy); background:var(--paper-2); }
  .crumb:not(.active):not(:disabled):hover{ background:var(--paper); color:var(--ink); }
  .crumb:disabled{ color:#C7CAE0; cursor:default; }
  .crumb-sep{ width:16px; height:16px; margin:0 2px; flex:none; color:var(--red); opacity:.8; }

  .page{ max-width:1180px; margin:0 auto; padding:30px 22px 70px; }
  .page-head{ margin-bottom:22px; }
  .eyebrow{ font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.12em; color:var(--red-dark); font-weight:600; text-transform:uppercase; }
  .page-title{ font-size:34px; color:var(--navy); margin:4px 0 0; line-height:1.05; }
  .page-desc{ color:var(--ink-soft); font-size:13.5px; margin-top:6px; max-width:640px; }

  /* ---------- Grid / cards ---------- */
  .grid{ display:grid; gap:16px; }
  .grid-3{ grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); }
  .grid-4{ grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); }

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px;
    box-shadow:var(--shadow); position:relative; overflow:hidden; text-align:left;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s;
  }
  .card.clickable{ cursor:pointer; }
  .card.clickable:hover{ transform:translateY(-3px); border-color:var(--red); box-shadow:0 20px 34px -18px rgba(231,38,44,.35); }
  .card-accent{ position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--red); }
  .card-title{ font-size:21px; color:var(--navy); margin:0 0 3px; }
  .card-note{ font-size:11.5px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; }

  /* progress ring "bulb" */
  .ring-wrap{ display:flex; align-items:center; gap:14px; margin-top:14px; }
  .ring{ width:56px; height:56px; flex:none; }
  .ring-pct{ font-size:20px; font-weight:800; font-family:'Barlow Condensed',sans-serif; color:var(--navy); }
  .ring-label{ font-size:10.5px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; }

  .bar{ height:7px; border-radius:99px; background:var(--paper-2); overflow:hidden; margin-top:12px; }
  .bar > i{ display:block; height:100%; background:linear-gradient(90deg,var(--amber),var(--red)); border-radius:99px; transition:width .3s ease; }

  .pill{ display:inline-flex; align-items:center; gap:6px; font-size:10.5px; font-weight:700; letter-spacing:.04em; padding:4px 9px; border-radius:99px; text-transform:uppercase; font-family:'JetBrains Mono',monospace; }
  .pill-done{ background:#E7F7EE; color:var(--green); }
  .pill-progress{ background:#FDF3E3; color:#966011; }
  .pill-empty{ background:#F1F2F8; color:var(--ink-soft); }

  /* ---------- Buttons ---------- */
  .btn{
    padding:10px 16px; border-radius:9px; font-size:13px; font-weight:700; border:1.5px solid var(--line);
    background:#fff; color:var(--navy); transition:all .15s;
  }
  .btn:hover{ border-color:var(--navy); }
  .btn-accent{ background:linear-gradient(180deg,var(--red),var(--red-dark)); border-color:transparent; color:#fff; box-shadow:0 10px 18px -9px rgba(231,38,44,.6); }
  .btn-accent:hover{ filter:brightness(1.05); }
  .btn-ghost{ background:transparent; border-color:transparent; color:var(--ink-soft); }
  .btn-ghost:hover{ color:var(--navy); background:var(--paper-2); }
  .btn-sm{ padding:7px 12px; font-size:12px; border-radius:7px; }
  .btn-danger{ color:var(--red-dark); border-color:#F3C6C8; }
  .btn-danger:hover{ background:#FDEBEC; }

  /* ---------- Floors ---------- */
  .floor-list{ display:flex; flex-direction:column; gap:10px; }
  .floor-row{
    display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; box-shadow:var(--shadow);
  }
  .floor-name{ font-weight:700; color:var(--navy); font-size:15px; flex:none; width:150px; }
  .floor-meta{ font-size:11.5px; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; flex:1; }
  .floor-actions{ display:flex; gap:8px; }

  .row-inline-input{
    padding:8px 10px; border-radius:8px; border:1.5px solid var(--line); background:var(--paper);
    font-size:12.5px; color:var(--ink); font-family:'JetBrains Mono',monospace; width:130px;
  }
  .row-inline-input:focus{ border-color:var(--red); background:#fff; }

  /* ---------- Data table screen ---------- */
  .tabs{ display:flex; gap:6px; margin-bottom:18px; border-bottom:1px solid var(--line); }
  .tab{ padding:10px 16px; font-size:13px; font-weight:700; color:var(--ink-soft); background:none; border:none; border-bottom:2.5px solid transparent; margin-bottom:-1px; }
  .tab.active{ color:var(--red-dark); border-bottom-color:var(--red); }

  .table-wrap{ overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); }
  table{ border-collapse:collapse; width:100%; min-width:760px; font-size:13px; }
  thead th{
    background:var(--navy); color:#fff; text-align:left; padding:11px 12px; font-size:10.5px; letter-spacing:.05em;
    text-transform:uppercase; font-family:'JetBrains Mono',monospace; white-space:nowrap; position:sticky; top:0;
  }
  tbody td{ padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tbody tr:hover{ background:var(--paper); }
  tbody input, tbody select{
    width:100%; min-width:110px; border:1.5px solid transparent; background:transparent; padding:7px 8px; border-radius:7px;
    font-size:13px; color:var(--ink); font-family:inherit;
  }
  tbody input:focus, tbody select:focus{ border-color:var(--red); background:#fff; }
  .row-no{ color:var(--ink-soft); font-family:'JetBrains Mono',monospace; font-size:12px; width:34px; text-align:center; }
  .row-del{ color:var(--red-dark); background:none; border:none; padding:6px; border-radius:6px; }
  .row-del:hover{ background:#FDEBEC; }
  .table-foot{ display:flex; justify-content:space-between; align-items:center; padding:12px 14px; }

  /* ---------- Vertical record entry (stacked, scrolls down not sideways) ---------- */
  .record-list{ display:flex; flex-direction:column; gap:14px; }
  .record-card{
    background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow);
    padding:16px 16px 6px;
  }
  .record-head{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;
    padding-bottom:10px; border-bottom:1px solid var(--line);
  }
  .record-no{
    font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700; color:var(--red-dark);
    background:#FDEBEC; padding:4px 10px; border-radius:99px;
  }
  .field-stack{ display:flex; flex-direction:column; }
  .field-item{
    display:flex; flex-direction:column; gap:5px; padding:10px 0; border-bottom:1px solid var(--paper-2);
  }
  .field-item:last-child{ border-bottom:none; }
  .field-item label{
    font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft);
    font-family:'JetBrains Mono',monospace;
  }
  .field-item input, .field-item select{
    width:100%; border:1.5px solid var(--line); background:var(--paper); padding:9px 10px; border-radius:8px;
    font-size:14px; color:var(--ink); font-family:inherit;
  }
  .field-item input:focus, .field-item select:focus{ border-color:var(--red); background:#fff; }
  .record-foot{ display:flex; justify-content:flex-end; padding:10px 0 14px; }

  .empty-state{ text-align:center; padding:60px 20px; color:var(--ink-soft); }
  .empty-state .bolt{ color:#D7DAEE; margin-bottom:10px; }
  .empty-state h3{ color:var(--navy); font-size:22px; margin:0 0 6px; }
  .empty-state p{ font-size:13px; max-width:340px; margin:0 auto 18px; }

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
    background:var(--navy); color:#fff; padding:11px 20px; border-radius:99px; font-size:13px; font-weight:600;
    box-shadow:0 14px 30px -10px rgba(0,0,0,.4); transition:all .25s ease; pointer-events:none; z-index:100;
    display:flex; align-items:center; gap:8px;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(16,27,76,.55); backdrop-filter:blur(2px); display:flex; align-items:center;
    justify-content:center; z-index:90; padding:20px;
  }
  .modal{ background:#fff; border-radius:16px; padding:26px; width:100%; max-width:360px; box-shadow:0 30px 60px -20px rgba(0,0,0,.5); }
  .modal h3{ font-size:22px; color:var(--navy); margin:0 0 4px; }
  .modal p{ font-size:12.5px; color:var(--ink-soft); margin:0 0 16px; }
  .modal-actions{ display:flex; gap:10px; margin-top:18px; }
  .modal-actions .btn{ flex:1; }

  @media (max-width:640px){
    .page{ padding:20px 14px 60px; }
    .floor-name{ width:auto; }
    .floor-row{ flex-wrap:wrap; }
  }
</style>
</head>

/* Maps a CATEGORIES.id to the TEMPLATES key above (acmv has 3 sub-templates,
   lighting has 2 sub-templates: main data + sampling) */
function templateKeyFor(catId, subId){
  if(catId==='acmv'){
    if(subId==='split') return 'acmv_split';
    if(subId==='ahu') return 'acmv_ahu';
    if(subId==='chiller') return 'acmv_chiller';
  }
  if(catId==='lighting'){
    if(subId==='sampling') return 'lighting_sampling';
    return 'lighting'; // main data
  }
  if(catId==='lift') return 'lift';
  return catId; // office, datalogger
}

/* HEADER_CELLS — cell utk tulis Project / Building / Location pada setiap
   sheet. Key ialah TEMPLATES key (bukan cat:sub), sebab header ni milik
   template/sheet itu sendiri. Sheet yang tiada dlm dict (contoh "lift")
   memang tak ada header berasingan - info dah tertanam sbg field biasa. */
const HEADER_CELLS = {
  lighting:          { Project:'B5', Building:'B6', Location:'B7' },
  lighting_sampling: { Project:'C5', Building:'C6', Location:'C7' },
  acmv_split:        { Project:'B5', Building:'B6', Location:'B7' },
  acmv_ahu:          { Project:'D5', Building:'D6', Location:'D7' },
  acmv_chiller:      { Project:'B4', Building:'D4', Location:'F4' },
  office:            { Project:'B3', Building:'B4' },
  datalogger:        { Project:'B4', Building:'D4', Location:'F4' },
};

function writeHeaderCells(ws, tplKey, projectName, buildingName, location){
  const cells = HEADER_CELLS[tplKey];
  if(!cells) return;
  if(cells.Project) setCell(ws, cells.Project, projectName);
  if(cells.Building) setCell(ws, cells.Building, buildingName);
  if(cells.Location) setCell(ws, cells.Location, location);
}

  return XLSX.utils.encode_col(XLSX.utils.decode_col(letter) + offset);
}
const TIME_FIELDS = new Set(['Weekdays Start','Weekdays End','Sat & Sun Start','Sat & Sun End']);

function setCell(ws, ref, value, fieldName){
  if(value===undefined || value===null || value===''){
    ws[ref] = { t:'s', v:'' };
    return;
  }
  // Medan masa (24 jam, format "HH:MM" dari <input type=time>) -> Excel time serial
  if(fieldName && TIME_FIELDS.has(fieldName)){
    const m = /^(\d{1,2}):(\d{2})$/.exec(value.toString().trim());
    if(m){
      const frac = (parseInt(m[1],10) + parseInt(m[2],10)/60) / 24;
      ws[ref] = { t:'n', v:frac, z:'hh:mm' };
      return;
    }
  }
  // Auto-kesan nombor supaya formula Excel (Total Load, Weekly Energy, dll) berfungsi
  const str = value.toString().trim();
  if(str!=='' && !isNaN(str) && !/^0\d/.test(str)){
    ws[ref] = { t:'n', v:Number(str) };
    return;
  }
  ws[ref] = { t:'s', v: str };
}

/* Builds (or reuses) a worksheet for one category/sub using its template
   if one was pasted above, otherwise falls back to a plain aoa sheet. */
function sheetFromTemplateOrPlain(catId, subId, fields, rows, projectName, buildingName, location){
  const tplKey = templateKeyFor(catId, subId);
  const b64 = TEMPLATES[tplKey];
  const layoutKey = `${catId}:${subId}`;
  const layout = TEMPLATE_LAYOUT[layoutKey];

  if(b64){
    try{
      const tplWb = XLSX.read(b64, { type:'base64' });
      const sheetName = tplWb.SheetNames[0]; // setiap template kategori ni satu sheet je
      const ws = tplWb.Sheets[sheetName];
      writeHeaderCells(ws, tplKey, projectName, buildingName, location);
      const range = XLSX.utils.decode_range(ws['!ref']);
      let maxRow = range.e.r;
      let maxCol = range.e.c;

      if(layout && layout.mode === 'table'){
        rows.forEach((row, i)=>{
          const r = layout.startRow + i; // 1-indexed excel row number
          if(layout.serialColumn){
            setCell(ws, layout.serialColumn + r, i + 1);
            maxCol = Math.max(maxCol, XLSX.utils.decode_col(layout.serialColumn));
          }
          layout.columns.forEach((colLetter, idx)=>{
            if(!colLetter) return;
            const f = fields[idx];
            setCell(ws, colLetter + r, row[f], f);
            maxCol = Math.max(maxCol, XLSX.utils.decode_col(colLetter));
          });
          maxRow = Math.max(maxRow, r - 1);
        });

      } else if(layout && layout.mode === 'mixed'){
        const gi = layout.generalInfo, tb = layout.table;
        // Maklumat am — hanya guna entri PERTAMA (satu nilai sahaja per field)
        if(rows.length > 0){
          for(let idx = 0; idx < gi.count; idx++){
            const r = gi.startRow + idx;
            setCell(ws, gi.column + r, rows[0][fields[idx]], fields[idx]);
            maxRow = Math.max(maxRow, r - 1);
          }
        }
        // Jadual ukuran berulang — guna baki fields (selepas generalInfo.count)
        rows.forEach((row, i)=>{
          const r = tb.startRow + i;
          tb.columns.forEach((colLetter, idx)=>{
            if(!colLetter) return;
            const f = fields[gi.count + idx];
            setCell(ws, colLetter + r, row[f], f);
            maxCol = Math.max(maxCol, XLSX.utils.decode_col(colLetter));
          });
          maxRow = Math.max(maxRow, r - 1);
        });

      } else if(layout && layout.mode === 'linked-tables'){
        rows.forEach((row, i)=>{
          const linkVal = row[layout.linkField];
          let fieldCursor = 1; // fields[0] ialah linkField (global, dah diguna)
          layout.tables.forEach(table=>{
            const r = table.startRow + i;
            const cols = table.columns;
            setCell(ws, cols[0] + r, linkVal, layout.linkField);
            maxCol = Math.max(maxCol, XLSX.utils.decode_col(cols[0]));
            for(let k=0; k<table.dataCount; k++){
              const colLetter = cols[k+1];
              const f = fields[fieldCursor + k];
              if(!colLetter) continue;
              setCell(ws, colLetter + r, row[f], f);
              maxCol = Math.max(maxCol, XLSX.utils.decode_col(colLetter));
            }
            fieldCursor += table.dataCount;
            maxRow = Math.max(maxRow, r - 1);
          });
        });

      } else if(layout && layout.mode === 'columns-per-entry'){
        rows.forEach((row, entryIdx)=>{
          const col = colOffset(layout.startCol, entryIdx);
          maxCol = Math.max(maxCol, XLSX.utils.decode_col(col));
          fields.forEach((f, idx)=>{
            const r = layout.startRow + idx;
            setCell(ws, col + r, row[f], f);
            maxRow = Math.max(maxRow, r - 1);
          });
        });

      } else {
        // Tiada layout khusus -> fallback lama (append lepas row terakhir template)
        let r = range.e.r + 1;
        if(range.e.r === 0) r = 1;
        rows.forEach(row=>{
          fields.forEach((f, c)=>{
            setCell(ws, XLSX.utils.encode_cell({ r:r, c:c }), row[f], f);
          });
          r++;
        });
        maxRow = r - 1;
        maxCol = Math.max(maxCol, fields.length - 1);
      }

      ws['!ref'] = XLSX.utils.encode_range({ s:{r:0,c:0}, e:{r:maxRow, c:maxCol} });
      return { ws, usedTemplate:true };
    }catch(e){
      console.warn('Template parse failed for', tplKey, '— falling back to plain sheet.', e);
    }
  }
  const aoa = [fields, ...rows.map(r=>fields.map(f=>r[f]!==undefined?r[f]:''))];
  return { ws: XLSX.utils.aoa_to_sheet(aoa), usedTemplate:false };
}

/* ---------------- Google Sheets / Local Storage Setup ----------------
   Data disimpan dalam satu Google Sheet melalui satu Google Apps Script
   "Web App" yang bertindak sebagai API (GET untuk baca, POST untuk tulis).
   Ikuti panduan deploy Apps Script yang diberikan berasingan, dapatkan URL
   Web App (bentuk: https://script.google.com/macros/s/XXXXX/exec), dan
   tampal URL tersebut di bawah. Selagi belum ditampal, app akan guna
   localStorage sahaja (data tersimpan dalam browser ini sahaja). */
const GOOGLE_SHEETS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxHSiSVwL7pK-TfxYwPWBMLbbp24BMLvQwsX4hrPjaqLisYFQL2USnSY170vY5J8HKzfg/exec";

const isSheetsConfigured = GOOGLE_SHEETS_WEBAPP_URL && GOOGLE_SHEETS_WEBAPP_URL !== "https://script.google.com/macros/s/AKfycbxHSiSVwL7pK-TfxYwPWBMLbbp24BMLvQwsX4hrPjaqLisYFQL2USnSY170vY5J8HKzfg/exec";

async function sget(key, fallback){
  if(isSheetsConfigured){
    try{
      const res = await fetch(`${GOOGLE_SHEETS_WEBAPP_URL}?action=get&key=${encodeURIComponent(key)}`);
      const data = await res.json();
      if(data && data.ok && data.value !== null && data.value !== undefined){
        // Keep localStorage in sync as an offline fallback cache
        localStorage.setItem('tnbes_' + key, data.value);
        return JSON.parse(data.value);
      }
    }catch(e){
      console.warn('Google Sheets fallback to localStorage:', e);
    }
  }
  const local = localStorage.getItem('tnbes_' + key);
  return local ? JSON.parse(local) : fallback;
}

async function sset(key, value){
  cache[key] = value;
  const json = JSON.stringify(value);
  localStorage.setItem('tnbes_' + key, json);
  if(isSheetsConfigured){
    try{
      // text/plain content-type avoids a CORS preflight against Apps Script
      await fetch(GOOGLE_SHEETS_WEBAPP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'set', key, value: json })
      });
    }catch(e){
      console.warn('Saved locally (Google Sheets unavailable)', e);
    }
  }
}

function floorsKey(buildingId){ return `floors:${buildingId}`; }
function uid(){ return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function randCode(len){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s=''; for(let i=0;i<len;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}

async function getAdminAuth(){ return await sget('adminAuth', {username:'admin', password:'admin123'}); }
async function tryLogin(u,p){
  try {
    const adminAuth = await getAdminAuth();
    if(u===adminAuth.username && p===adminAuth.password){
      return { role:'admin', label:'Administrator', name:u };
    }

/* ---------------- Utility ---------------- */
function svgBolt(cls){
  return `<svg class="bolt ${cls||''}" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="16" height="16">
    <path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" fill="currentColor"/></svg>`;
}
function svgLogo(){
  return `<svg viewBox="0 0 100 100" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
    <path d="M28 8 H72 A6 6 0 0 1 78 14 V44 A6 6 0 0 1 72 50 H63 V58 H37 V50 H28 A6 6 0 0 1 22 44 V14 A6 6 0 0 1 28 8 Z"
      fill="none" stroke="#E7262C" stroke-width="7" stroke-linejoin="round"/>
    <path d="M40 65 H60 A5 5 0 0 1 60 75 H40 A5 5 0 0 1 40 65 Z" fill="#E7262C"/>
    <path d="M42 80 H58 A4 4 0 0 1 58 88 H42 A4 4 0 0 1 42 80 Z" fill="#E7262C"/>
    <path d="M56 14 34 40 H47 L43 58 68 30 H54 Z" fill="#E7262C"/>
  </svg>`;
}
function ringSVG(pct){
  const r=24, c=2*Math.PI*r, off=c*(1-pct/100);
  const color = pct>=100?'var(--green)': pct>0?'var(--amber)':'#D7DAEE';
  return `<svg viewBox="0 0 56 56" width="56" height="56">
    <circle cx="28" cy="28" r="${r}" stroke="#EDEEF6" stroke-width="6" fill="none"/>
    <circle cx="28" cy="28" r="${r}" stroke="${color}" stroke-width="6" fill="none"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"
      transform="rotate(-90 28 28)" style="transition:stroke-dashoffset .4s ease"/>
  </svg>`;
}
function pillFor(pct){
  if(pct>=100) return `<span class="pill pill-done">${svgBolt()} Complete</span>`;
  if(pct>0) return `<span class="pill pill-progress">${svgBolt()} In progress</span>`;
  return `<span class="pill pill-empty">Not started</span>`;
}
function toast(msg){
  let t = document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
  t.innerHTML = svgBolt()+ ' ' + msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}
function rowFilled(row, fields){ return fields.some(f => (row[f]||'').toString().trim() !== ''); }
function isAdmin(){ return state.user && state.user.role==='admin'; }

/* ---------------- Progress ---------------- */
function catFilledInFloor(floor, catId){
  const subs = subTypesFor(catId);
  const data = floor.data || {};
  return subs.some(s=>{
    const fields = fieldsFor(catId, s.id);
    return (data[`${catId}:${s.id}`]||[]).some(r=>rowFilled(r,fields));
  });
}
function floorProgressPct(floor){
  const filled = CATEGORIES.filter(c=>catFilledInFloor(floor,c.id)).length;
  return Math.round((filled/CATEGORIES.length)*100);
}
async function buildingProgress(buildingId){
  const floors = await sget(floorsKey(buildingId), []);
  if(floors.length===0) return 0;
  let total=0; floors.forEach(fl=>{ total += floorProgressPct(fl); });
  return Math.round(total/floors.length);
}
async function phaseProgress(phaseId){
  const buildings = (await sget('buildings', [])).filter(b=>b.phaseId===phaseId);
  if(buildings.length===0) return 0;
  let total=0;
  for(const b of buildings){ total += await buildingProgress(b.id); }
  return Math.round(total/buildings.length);
}

/* ---------------- Pembantu Nama Sheet Unik ---------------- */
function makeUniqueSheetName(wb, rawName) {
  // Buang aksara yang dilarang oleh Excel: \ / ? * : [ ]
  let cleanName = (rawName || 'Sheet').replace(/[\\/:*?\[\]]/g, '').trim();
  
  // Ambil 28 aksara pertama supaya ada ruang untuk penambahan suffix seperti " (1)"
  let baseName = cleanName.slice(0, 28);
  let sheetName = cleanName.slice(0, 31) || "Sheet";
  let counter = 1;

  // Semak dan jana nama baharu jika nama sheet sudah wujud
  while (wb.SheetNames.includes(sheetName)) {
    sheetName = `${baseName} (${counter})`;
    counter++;
  }
  return sheetName;
}

/* ---------------- Excel download (per floor) ---------------- */
function downloadFloorExcel(floor){
  if(typeof XLSX === 'undefined'){ toast('Excel library belum siap dimuat — cuba lagi sekejap'); return; }
  const wb = XLSX.utils.book_new();
  let any = false;
  const projectName = state._projectName || '';
  const buildingName = state._buildingName || '';
  const location = state._buildingLocation || '';
  CATEGORIES.forEach(c=>{
    c.subTypes.forEach(s=>{
      const dataKey = `${c.id}:${s.id}`;
      const rows = (floor.data && floor.data[dataKey]) || [];
      const fields = fieldsFor(c.id, s.id);
      const layoutKey = `${c.id}:${s.id}`;
      const layout = TEMPLATE_LAYOUT[layoutKey];
      const rawName = (c.subTypes.length > 1 ? `${c.name} - ${s.name}` : c.name);

      if(layout && layout.mode === 'grid-per-entry'){
        // Satu entri (contoh: satu unit AHU) = SATU sheet penuh (klon template)
        if(rows.length===0) return;
        rows.forEach((row, i)=>{
          const tplKey = templateKeyFor(c.id, s.id);
          const b64 = TEMPLATES[tplKey];
          if(!b64) return;
          const tplWb = XLSX.read(b64, { type:'base64' });
          const ws = tplWb.Sheets[tplWb.SheetNames[0]];
          writeHeaderCells(ws, tplKey, projectName, buildingName, location);
          Object.entries(layout.cells).forEach(([fieldName, cellRef])=>{
            setCell(ws, cellRef, row[fieldName], fieldName);
          });
          const suffix = row['AHU Tag No.'] ? ` - ${row['AHU Tag No.']}` : (rows.length>1 ? ` #${i+1}` : '');
          const sheetName = makeUniqueSheetName(wb, rawName + suffix);
          XLSX.utils.book_append_sheet(wb, ws, sheetName);
          any = true;
        });
        return;
      }

      const { ws } = sheetFromTemplateOrPlain(c.id, s.id, fields, rows, projectName, buildingName, location);
      const sheetName = makeUniqueSheetName(wb, rawName);

      XLSX.utils.book_append_sheet(wb, ws, sheetName);
      if(rows.length>0) any = true;
    });
  });
  if(!any){ toast('Tiada data untuk dimuat turun lagi'); }
  const fname = `${state._teamName||'Team'} - ${state._buildingName||'Building'} - ${floor.name}.xlsx`.replace(/[\\/:*?"<>|]/g,'-');
  XLSX.writeFile(wb, fname);
  toast('Fail Excel dimuat turun ✓');
}

/* ---------------- Excel download (compiled, whole Phase) ---------------- */
async function downloadPhaseCompiledExcel(phase){
  if(typeof XLSX === 'undefined'){ toast('Excel library belum siap dimuat — cuba lagi sekejap'); return; }
  const buildings = (await sget('buildings', [])).filter(b=>b.phaseId===phase.id);
  if(buildings.length===0){ toast('Tiada bangunan dalam phase ini lagi'); return; }

  // Compile one combined sheet per category (across ALL buildings & floors),
  // with Building/Floor columns prefixed so data stays traceable.
  const wb = XLSX.utils.book_new();
  let any = false;
  for(const c of CATEGORIES){
    for(const s of c.subTypes){
      const fields = ['Building','Floor', ...fieldsFor(c.id, s.id)];
      const combinedRows = [];
      for(const b of buildings){
        const floors = await sget(floorsKey(b.id), []);
        floors.forEach(fl=>{
          const dataKey = `${c.id}:${s.id}`;
          const rows = (fl.data && fl.data[dataKey]) || [];
          rows.forEach(r=>{
            combinedRows.push({ ...r, Building:b.name, Floor:fl.name });
          });
        });
      }
      const aoa = [fields, ...combinedRows.map(r=>fields.map(f=>r[f]!==undefined?r[f]:''))];
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      
      const rawName = (c.subTypes.length > 1 ? `${c.name} - ${s.name}` : c.name);
      const sheetName = makeUniqueSheetName(wb, rawName);

      XLSX.utils.book_append_sheet(wb, ws, sheetName);
      if(combinedRows.length>0) any = true;
    }
  }
  if(!any){ toast('Tiada data untuk dimuat turun lagi dalam phase ini'); }
  const fname = `${state._teamName||'Team'} - ${phase.name} - Compiled Overall Data.xlsx`.replace(/[\\/:*?"<>|]/g,'-');
  XLSX.writeFile(wb, fname);
  toast('Fail Excel compiled dimuat turun ✓');
}

      </div>
      <div class="field-stack">
        ${fields.map(f=>`
          <div class="field-item">
            <label>${f}</label>
            ${fieldControlHtml(f, idx, r)}
          </div>`).join('')}
      </div>
    </div>`).join('');

  const tabsHtml = subs.length>1 ? `
    <div class="tabs">
      ${subs.map(s=>`<button class="tab ${s.id===activeSub.id?'active':''}" data-tab="${s.id}">${s.name}</button>`).join('')}
    </div>` : '';

  setTimeout(()=>{
    if(subs.length>1){
      document.querySelectorAll('[data-tab]').forEach(el=>{
        el.onclick = ()=>{ state.subTab = el.getAttribute('data-tab'); render(); };
      });
    }
    document.getElementById('addRowBtn').onclick = async ()=>{
      const blank = {}; fields.forEach(f=>blank[f]='');
      if(fields.includes('Level')) blank['Level'] = floor.name;
      floor.data[dataKey] = [...rows, blank];
      await sset(key, floors);
      render();
      // scroll to the newly added record at the bottom of the list
      setTimeout(()=>{ window.scrollTo({ top: document.body.scrollHeight, behavior:'smooth' }); }, 50);
    };
    document.querySelectorAll('[data-delrow]').forEach(el=>{
      el.onclick = async ()=>{
        if(!confirm('Padam record ini?')) return;
        const idx = parseInt(el.getAttribute('data-delrow'));
        floor.data[dataKey].splice(idx,1);
        await sset(key, floors);
        render();
      };
    });
    // Dropdown biasa (tiada pasangan "Other") + input biasa
    document.querySelectorAll('#recordList input:not([data-other-input]), #recordList select:not([data-other-select])').forEach(el=>{
      el.addEventListener('change', async ()=>{
        const idx = parseInt(el.getAttribute('data-r'));
        const f = el.getAttribute('data-f');
        floor.data[dataKey][idx][f] = el.value;
        await sset(key, floors);
      });
    });
    // Dropdown + kotak "Other" (pasangan select+input dlm .dd-other-wrap)
    document.querySelectorAll('.dd-other-wrap').forEach(wrap=>{
      const sel = wrap.querySelector('[data-other-select]');
      const inp = wrap.querySelector('[data-other-input]');
      const idx = parseInt(sel.getAttribute('data-r'));
      const f = sel.getAttribute('data-f');
      const isTrigger = ()=> sel.value==='Other' || sel.value==='(O) Others';
      sel.addEventListener('change', async ()=>{
        if(isTrigger()){
          inp.style.display = '';
          inp.focus();
          floor.data[dataKey][idx][f] = inp.value || sel.value;
        } else {
          inp.style.display = 'none';
          inp.value = '';
          floor.data[dataKey][idx][f] = sel.value;
        }
        await sset(key, floors);
      });
      inp.addEventListener('change', async ()=>{
        floor.data[dataKey][idx][f] = inp.value || sel.value;
        await sset(key, floors);
      });
    });
  });

  return `
  <div class="page-head">
    <div class="eyebrow">${state._buildingName} · ${state._floorName}</div>
    <h1 class="page-title">${cat.name}</h1>
    <p class="page-desc">${activeSub.name} </p>
  </div>
  ${tabsHtml}
  <div id="recordList" class="record-list">
    ${recordCards || `<div class="empty-state">${svgBolt()}<h3>Tiada data lagi</h3><p>Tekan "Add Row" di bawah untuk mula.</p></div>`}
  </div>
  <div class="record-foot" style="justify-content:space-between; align-items:center;">
    <span class="card-note">${rows.length} record(s)</span>
    <button class="btn btn-accent" id="addRowBtn">${svgBolt()} Add Row</button>
  </div>`;
}

/* ---------------- Boot ---------------- */
render();
</script>
</body>
</html>
